# Pins the Shopify CLI to the Vivid Direct store so `shopify theme ...`
# commands never fall back to another store remembered from a different
# project.
# Usage: shopify theme push -e production   (or -e for pull/dev/list)
#
# production = the CLIENT store vivid-direct, theme setup/vivid-direct-base
# (LIVE). The GitHub sync on that branch also deploys there but can silently
# drop code-file commits when both sides edit at once — for
# assets/sections/snippets prefer a direct CLI push.

[environments.production]
store = "vivid-direct-uuha9esw.myshopify.com"
theme = "204153880924"
